<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12px; fill: #57606a; }
      .g { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      .tab { font-size: 12px; font-weight: 700; fill: #c2562f; letter-spacing: .04em; }
      .e { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .el { font-size: 11px; fill: #475569; font-style: italic; }
      .pill { font-size: 10px; font-weight: 700; fill: #ffffff; }
