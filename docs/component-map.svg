  <text x="1076" y="130" class="s">app/api/ingest/{call, whatsapp, web-form} → lib/ingest-http</text>
  <text x="1076" y="145" class="s">app/api/cron/{sla-check, voice-sync}</text>

  <path class="e" d="M320 122 H366"/>
  <path class="e" d="M740 122 H694"/>
  <text x="700" y="112" class="el">wraps</text>

  <!-- ===== Row B: shell ===== -->
  <rect x="370" y="196" width="320" height="64" rx="10" fill="#eef0ff" stroke="#5b5bd6"/>
  <text x="386" y="222" class="t">Shell.tsx</text>
  <text x="386" y="244" class="s">role tabs · month picker · Flash · LiveRefresh*</text>
  <path class="e" d="M530 154 V192"/>

  <!-- ===== Row C: views ===== -->
  <rect x="40" y="306" width="440" height="152" rx="14" fill="none" stroke="#0f8a78" stroke-width="1.4"/>
  <text x="58" y="330" class="g" fill="#0f8a78">Founder + designer views</text>
