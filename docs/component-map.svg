  <text x="790" y="520" class="s">opened from Inbox (?id=…), four tabs (?tab=…)</text>
  <path class="e" d="M657 440 V492"/>

  <rect x="540" y="534" width="1000" height="48" rx="10" fill="#fdf0ea" stroke="#c2562f"/>
