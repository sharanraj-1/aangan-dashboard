  <text x="1064" y="741" class="t" font-size="13">ClientEmailPanel</text>
  <text x="1064" y="757" class="s" font-size="11">draft + send client email</text>
  <rect x="1050" y="774" width="235" height="44" rx="9" fill="#fdf0ea" stroke="#c2562f"/>
  <text x="1064" y="793" class="t" font-size="13">OutcomePanel.tsx</text>
