  </defs>

  <rect width="1600" height="1170" fill="#ffffff"/>

  <text x="40" y="44" font-size="26" font-weight="700" fill="#1f2328">Aangan Studio Enquiry Desk — component map</text>
  <text x="40" y="66" class="s" font-size="13">Next.js 16 App Router · one page ("/") that renders a view by role and ?view= · server components unless noted</text>

  <!-- ===== Row A: entry ===== -->
  <rect x="40" y="90" width="280" height="64" rx="10" fill="#eef2f7" stroke="#64748b"/>
  <text x="56" y="116" class="t">proxy.ts</text>
  <text x="56" y="138" class="s">Basic auth → role (designer / founder)</text>

  <rect x="370" y="90" width="320" height="64" rx="10" fill="#eef2f7" stroke="#64748b"/>
  <text x="386" y="116" class="t">app/page.tsx</text>
  <text x="386" y="138" class="s">loads store + metrics, picks view for role</text>

  <rect x="740" y="90" width="250" height="64" rx="10" fill="#eef2f7" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="756" y="116" class="t">app/layout.tsx</text>
  <text x="756" y="138" class="s">fonts · globals.css · &lt;html&gt;</text>

  <rect x="1060" y="90" width="500" height="64" rx="10" fill="#eef2f7" stroke="#64748b"/>
